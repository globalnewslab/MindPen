<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MindPen — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --ink: #1a1a18;
      --paper: #f5f2eb;
      --cream: #ede9de;
      --accent: #b5452a;
      --muted: #8a8578;
      --border: #d4cfc4;
      --sidebar-w: 240px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      opacity: 0;
      transition: opacity 0.4s;
    }
    body.ready { opacity: 1; }

    /* ── Sidebar ─────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 28px 20px;
      position: fixed;
      top: 0; left: 0; bottom: 0;
    }

    .sidebar-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      color: var(--paper);
      margin-bottom: 4px;
    }
    .sidebar-logo span { color: var(--accent); font-style: italic; }

    .sidebar-tagline {
      font-size: 0.68rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(245,242,235,0.35);
      margin-bottom: 32px;
    }

    .sidebar-divider {
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin: 4px 0 16px;
    }

    .nav-label {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(245,242,235,0.3);
      margin-bottom: 8px;
      padding: 0 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 4px;
      font-size: 0.88rem;
      color: rgba(245,242,235,0.65);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      margin-bottom: 2px;
    }
    .nav-item:hover, .nav-item.active {
      background: rgba(255,255,255,0.08);
      color: var(--paper);
    }
    .nav-item.active { color: #f0c4b4; }

    .nav-icon {
      width: 16px;
      text-align: center;
      font-size: 0.95rem;
      opacity: 0.8;
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 4px;
      background: rgba(255,255,255,0.05);
    }

    .user-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem;
      font-weight: 500;
      color: white;
      flex-shrink: 0;
    }

    .user-email {
      font-size: 0.75rem;
      color: rgba(245,242,235,0.5);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .logout-btn {
      margin-top: 8px;
      width: 100%;
      padding: 8px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.78rem;
      color: rgba(245,242,235,0.45);
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      letter-spacing: 0.05em;
    }
    .logout-btn:hover { border-color: rgba(255,255,255,0.25); color: rgba(245,242,235,0.75); }

    /* ── Main ─────────────────────────────────── */
    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      padding: 40px 48px;
      min-height: 100vh;
    }

    .page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 36px;
    }

    .page-date {
      font-size: 0.75rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .page-title {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--ink);
    }

    .new-entry-btn {
      padding: 10px 20px;
      background: var(--ink);
      color: var(--paper);
      border: none;
      border-radius: 4px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .new-entry-btn:hover { background: #2e2e2a; }

    /* Stats row */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 36px;
    }

    .stat-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 20px 24px;
      animation: fadeUp 0.5s ease both;
    }
    .stat-card:nth-child(1) { animation-delay: 0.05s; }
    .stat-card:nth-child(2) { animation-delay: 0.1s; }
    .stat-card:nth-child(3) { animation-delay: 0.15s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .stat-label {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .stat-value {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--ink);
      line-height: 1;
    }
    .stat-sub {
      margin-top: 4px;
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* Section */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .see-all {
      font-size: 0.75rem;
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }

    /* Entry cards */
    .entries-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .entry-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 22px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      animation: fadeUp 0.5s ease both;
      position: relative;
    }
    .entry-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(26,26,24,0.08);
      border-color: #c4bfb4;
    }

    .entry-tag {
      display: inline-block;
      padding: 3px 8px;
      background: var(--cream);
      border-radius: 2px;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .entry-tag.theology { background: #f0e8d8; color: #8a6020; }
    .entry-tag.english  { background: #e0ecf5; color: #2a5a7a; }
    .entry-tag.idea     { background: #ede8f5; color: #5a3a8a; }

    .entry-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .entry-preview {
      font-size: 0.82rem;
      font-weight: 300;
      color: var(--muted);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .entry-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .entry-date {
      font-size: 0.72rem;
      color: var(--muted);
    }

    .entry-words {
      font-size: 0.72rem;
      color: var(--border);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background: white;
      border: 1px dashed var(--border);
      border-radius: 6px;
    }
    .empty-icon {
      font-size: 2.5rem;
      margin-bottom: 16px;
    }
    .empty-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      color: var(--ink);
      margin-bottom: 8px;
    }
    .empty-desc {
      font-size: 0.83rem;
      color: var(--muted);
      margin-bottom: 20px;
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 28px; right: 28px;
      background: var(--ink);
      color: var(--paper);
      padding: 12px 18px;
      border-radius: 4px;
      font-size: 0.83rem;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s, transform 0.3s;
      z-index: 100;
    }
    #toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 900px) {
      .stats-row { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 700px) {
      .sidebar { display: none; }
      .main { margin-left: 0; padding: 24px 20px; }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">Mind<span>Pen</span></div>
    <div class="sidebar-tagline">Your thoughts, written well</div>

    <div class="nav-label">Menu</div>
    <div class="nav-item active">
      <span class="nav-icon">✦</span> Dashboard
    </div>
    <div class="nav-item">
      <span class="nav-icon">✍</span> All Entries
    </div>
    <div class="nav-item">
      <span class="nav-icon">🔖</span> Bookmarks
    </div>
    <div class="sidebar-divider"></div>
    <div class="nav-label">Tags</div>
    <div class="nav-item">
      <span class="nav-icon" style="color:#c4a060">●</span> Theology
    </div>
    <div class="nav-item">
      <span class="nav-icon" style="color:#5a90b0">●</span> English
    </div>
    <div class="nav-item">
      <span class="nav-icon" style="color:#9a70c0">●</span> Ideas
    </div>

    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="user-avatar" id="user-avatar">?</div>
        <div class="user-email" id="user-email">Loading…</div>
      </div>
      <button class="logout-btn" onclick="handleLogout()">Sign out</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="page-header">
      <div>
        <div class="page-date" id="today-date"></div>
        <div class="page-title">Good morning ✦</div>
      </div>
      <button class="new-entry-btn" onclick="newEntry()">
        <span>+</span> New Entry
      </button>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total Entries</div>
        <div class="stat-value" id="stat-entries">0</div>
        <div class="stat-sub">journal entries</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">This Week</div>
        <div class="stat-value" id="stat-week">0</div>
        <div class="stat-sub">entries written</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Words</div>
        <div class="stat-value" id="stat-words">0</div>
        <div class="stat-sub">words captured</div>
      </div>
    </div>

    <!-- Recent entries -->
    <div class="section-header">
      <div class="section-title">Recent Entries</div>
      <div class="see-all">See all →</div>
    </div>

    <div class="entries-grid" id="entries-grid">
      <!-- Populated by JS -->
    </div>
  </main>

  <div id="toast"></div>

  <script>
    const SUPABASE_URL  = window.__ENV__?.SUPABASE_URL  || 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON = window.__ENV__?.SUPABASE_ANON || 'YOUR_SUPABASE_ANON_KEY';
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

    // ── Auth guard ─────────────────────────────────────────────
    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        window.location.href = 'login.html';
        return;
      }

      const user = session.user;
      const email = user.email || '';
      document.getElementById('user-email').textContent = email;
      document.getElementById('user-avatar').textContent = email[0]?.toUpperCase() || 'U';

      // Greeting by time
      const h = new Date().getHours();
      const greet = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
      document.querySelector('.page-title').textContent = greet + ' ✦';

      // Date
      const now = new Date();
      document.getElementById('today-date').textContent = now.toLocaleDateString('en-US', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
      });

      // Load entries (from Supabase if table exists, else demo)
      await loadEntries(user.id);

      document.body.classList.add('ready');
    }

    async function loadEntries(userId) {
      try {
        const { data, error } = await sb
          .from('entries')
          .select('*')
          .eq('user_id', userId)
          .order('created_at', { ascending: false })
          .limit(9);

        if (error) throw error;

        renderEntries(data || []);
        updateStats(data || []);
      } catch {
        // Table doesn't exist yet — show demo state
        renderDemo();
      }
    }

    function renderEntries(entries) {
      const grid = document.getElementById('entries-grid');
      if (!entries.length) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">✍️</div>
            <div class="empty-title">No entries yet</div>
            <div class="empty-desc">Start writing your first journal entry.</div>
            <button class="new-entry-btn" style="margin:0 auto" onclick="newEntry()">+ New Entry</button>
          </div>`;
        return;
      }

      grid.innerHTML = entries.map((e, i) => `
        <div class="entry-card" style="animation-delay:${i * 0.05 + 0.1}s">
          <div class="entry-tag">${e.tag || 'journal'}</div>
          <div class="entry-title">${e.title || 'Untitled'}</div>
          <div class="entry-preview">${e.content || ''}</div>
          <div class="entry-footer">
            <div class="entry-date">${formatDate(e.created_at)}</div>
            <div class="entry-words">${wordCount(e.content)} words</div>
          </div>
        </div>`).join('');
    }

    function renderDemo() {
      const demoEntries = [
        {
          tag: 'theology', title: '악의 문제와 하나님의 섭리',
          content: '욥기를 다시 읽으며 고난 속에서도 하나님의 주권이 어떻게 드러나는지 생각했다...',
          date: '오늘', words: 312
        },
        {
          tag: 'english', title: 'Passive voice in news writing',
          content: 'The passive voice is often used in journalism to create objectivity, or to avoid naming an agent...',
          date: '어제', words: 218
        },
        {
          tag: 'idea', title: 'MindPen 콘텐츠 기획안',
          content: '글쓰기 습관을 만드는 앱으로 발전시킬 수 있지 않을까. 매일 하나의 프롬프트, 타이머...',
          date: '2일 전', words: 145
        }
      ];

      const grid = document.getElementById('entries-grid');
      grid.innerHTML = demoEntries.map((e, i) => `
        <div class="entry-card" style="animation-delay:${i*0.07+0.1}s">
          <div class="entry-tag ${e.tag}">${e.tag}</div>
          <div class="entry-title">${e.title}</div>
          <div class="entry-preview">${e.content}</div>
          <div class="entry-footer">
            <div class="entry-date">${e.date}</div>
            <div class="entry-words">${e.words} words</div>
          </div>
        </div>`).join('');

      document.getElementById('stat-entries').textContent = '3';
      document.getElementById('stat-week').textContent = '3';
      document.getElementById('stat-words').textContent = '675';
    }

    function updateStats(entries) {
      const total = entries.length;
      const now = new Date();
      const weekAgo = new Date(now - 7 * 86400000);
      const thisWeek = entries.filter(e => new Date(e.created_at) > weekAgo).length;
      const totalWords = entries.reduce((s, e) => s + wordCount(e.content), 0);

      document.getElementById('stat-entries').textContent = total;
      document.getElementById('stat-week').textContent = thisWeek;
      document.getElementById('stat-words').textContent = totalWords.toLocaleString();
    }

    function wordCount(text) {
      if (!text) return 0;
      return text.trim().split(/\s+/).filter(Boolean).length;
    }

    function formatDate(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' });
    }

    async function handleLogout() {
      await sb.auth.signOut();
      window.location.href = 'login.html';
    }

    function newEntry() {
      showToast('✍ 에디터 기능은 다음 단계에서 추가됩니다!');
    }

    let toastTimer;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
    }

    init();
  </script>
</body>
</html>
